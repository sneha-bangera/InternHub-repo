services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RESUME_COMPILE_DIR: /var/lib/internhub/compile
      RESUME_ARTIFACT_DIR: /var/lib/internhub/artifacts
    ports:
      - "8000:8000"
    volumes:
      - resume-artifacts:/var/lib/internhub/artifacts:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "backend.celery_app.celery_app", "worker", "--loglevel=info"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      RESUME_COMPILE_DIR: /var/lib/internhub/compile
      RESUME_ARTIFACT_DIR: /var/lib/internhub/artifacts
    volumes:
      - resume-compile:/var/lib/internhub/compile
      - resume-artifacts:/var/lib/internhub/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  resume-compiler:
    build:
      context: .
      dockerfile: deploy/tectonic/Dockerfile
    platform: linux/amd64
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    cpus: 1.0
    mem_limit: 512m
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - resume-compile:/var/lib/internhub/compile
      - resume-artifacts:/var/lib/internhub/artifacts
    restart: unless-stopped

volumes:
  postgres-data:
  resume-compile:
  resume-artifacts:
